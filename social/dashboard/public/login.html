<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Pravnya Social</title>
  <link rel="icon" href="/favicon.svg">
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <div class="login">
    <form class="card" id="login">
      <img src="/favicon.svg" alt="">
      <h1>Pravnya Social</h1>
      <p class="muted small">Reels, rendering and posting.</p>
      <label for="password">Password</label>
      <input type="password" id="password" autocomplete="current-password" required autofocus>
      <button class="primary" type="submit">Sign in</button>
      <p id="error" class="notice error" role="alert" hidden></p>
    </form>
  </div>
  <script src="/login.js"></script>
</body>
</html>
