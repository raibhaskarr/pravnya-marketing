name: Render social reels

# Started from the social.pravnix.ai dashboard (or the Actions tab). Makes the voiceovers, renders every reel,
# and uploads the MP4s + reels.json as the "reels" artifact, which the dashboard downloads.
on:
  workflow_dispatch:
    inputs:
      filter:
        description: "Only render compositions whose id contains this (blank = all)"
        required: false
        default: ""

concurrency:
  group: social-render
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: social
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: social/package-lock.json

      - name: Fonts and Chromium libraries
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-color-emoji libnss3 libgbm1 libasound2t64 > /dev/null

      - run: npm ci

      # Voice clips are named by a hash of their text, so unchanged lines are reused instead of paid for again.
      - uses: actions/cache@v4
        with:
          path: social/public/voice
          key: voice-${{ hashFiles('social/src/reels/**', 'social/src/AppDemoReel.tsx') }}
          restore-keys: voice-

      - name: Voiceovers
        run: npm run tts
        env:
          SARVAM_API_KEY: ${{ secrets.SARVAM_API_KEY }}

      - name: Render
        run: npm run render -- "$FILTER"
        env:
          FILTER: ${{ inputs.filter }}

      - name: Manifest
        run: node scripts/manifest.mjs

      - uses: actions/upload-artifact@v4
        with:
          name: reels
          path: |
            social/out/*.mp4
            social/out/reels.json
          retention-days: 14
          if-no-files-found: error
